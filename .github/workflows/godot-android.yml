name: Godot Android 3D APK

on:
  push:
    branches: [main, master]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/android_debug.apk "$HOME/.local/share/godot/export_templates/4.3.stable/"
          cp /tmp/godot-templates/templates/android_release.apk "$HOME/.local/share/godot/export_templates/4.3.stable/"
          cp /tmp/godot-templates/templates/android_source.zip "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Configure Java, Android SDK and signing
        run: |
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android"
          test -n "$ANDROID_HOME" || test -n "$ANDROID_SDK_ROOT"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
      - name: Validate Godot project and import resources
        run: godot --headless --editor --path godot --quit
      - name: Configure Godot Android export settings
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          JAVA_PATH="${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}"
          echo "Android SDK: $SDK_PATH"
          echo "Java SDK: $JAVA_PATH"
          test -d "$SDK_PATH"
          test -x "$JAVA_PATH/bin/java"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK_PATH"
          export/android/java_sdk_path = "$JAVA_PATH"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "Installed Android SDK components:"
          ls -la "$SDK_PATH"
          find "$SDK_PATH" -maxdepth 3 -type d \( -name "platform-tools" -o -name "build-tools" -o -name "platforms" \) -print
          cat "$HOME/.config/godot/editor_settings-4.tres"
      - name: Install project Android build template
        run: |
          mkdir -p godot/android/build
          unzip -oq "$HOME/.local/share/godot/export_templates/4.3.stable/android_source.zip" -d godot/android/build
          test -f godot/android/build/build.gradle || find godot/android/build -maxdepth 3 -name build.gradle -print
          find godot/android/build -maxdepth 2 -type f | head -30
      - name: Export Android APK
        run: |
          mkdir -p godot/build
          godot --headless --verbose --path godot --export-debug "Android" godot/build/OLD-RACING-3D.apk
          test -s godot/build/OLD-RACING-3D.apk
      - name: Upload 3D APK
        uses: actions/upload-artifact@v4
        with:
          name: old-racing-3d-android-apk
          path: godot/build/OLD-RACING-3D.apk
          if-no-files-found: error
