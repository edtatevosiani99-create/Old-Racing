name: Godot Android 3D APK

on:
  push:
    branches: [main, master]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Download CC0 3D vehicle and environment assets
        run: |
          git clone --depth 1 https://github.com/Arslan12216775/kenney_car-kit.git /tmp/kenney-car-kit
          mkdir -p godot/assets/vehicles godot/assets/environment
          cp -R "/tmp/kenney-car-kit/Models/GLB format/." godot/assets/vehicles/
          cp -R "/tmp/kenney-car-kit/Models/City" godot/assets/environment/city
          cp /tmp/kenney-car-kit/License.txt godot/assets/THIRD_PARTY_LICENSES.txt
          # Add Kenney Nature Kit (official CC0 archive) for more varied roadside trees.
          wget -q https://kenney.nl/media/pages/assets/nature-kit/37ac38a37b-1677698939/kenney_nature-kit.zip -O /tmp/kenney_nature-kit.zip
          mkdir -p /tmp/kenney-nature-kit godot/assets/environment/nature
          unzip -q /tmp/kenney_nature-kit.zip -d /tmp/kenney-nature-kit
          cp "/tmp/kenney-nature-kit/Models/GLTF format/tree_oak.glb" godot/assets/environment/nature/
          cp "/tmp/kenney-nature-kit/Models/GLTF format/tree_default.glb" godot/assets/environment/nature/
          cp "/tmp/kenney-nature-kit/License.txt" godot/assets/environment/nature/LICENSE.txt
          cat godot/assets/environment/nature/LICENSE.txt >> godot/assets/THIRD_PARTY_LICENSES.txt
          test -s godot/assets/vehicles/race.glb
          test -s godot/assets/vehicles/Textures/colormap.png
          test -s godot/assets/environment/city/tree-large.glb
          test -s godot/assets/environment/city/building-type-a.glb
          test -s godot/assets/environment/nature/tree_oak.glb
          test -s godot/assets/environment/nature/tree_default.glb
      - name: Install matching Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/android_debug.apk "$HOME/.local/share/godot/export_templates/4.3.stable/"
          cp /tmp/godot-templates/templates/android_release.apk "$HOME/.local/share/godot/export_templates/4.3.stable/"
          cp /tmp/godot-templates/templates/android_source.zip "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Configure Java, Android SDK and signing
        run: |
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android"
          test -n "$ANDROID_HOME" || test -n "$ANDROID_SDK_ROOT"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storetype JKS -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
      - name: Install required Android SDK packages
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          SDKMANAGER="$(find "$SDK_PATH/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_PATH/cmdline-tools"
            find "$SDK_PATH" -maxdepth 5 -type f -name sdkmanager -print
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_PATH" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_PATH" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313"
          ls -la "$SDK_PATH/platforms"
          ls -la "$SDK_PATH/build-tools"
          ls -la "$SDK_PATH/ndk"
      - name: Validate Godot project and import resources
        run: godot --headless --editor --path godot --quit
      - name: Configure Godot Android export settings
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          JAVA_PATH="${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}"
          echo "Android SDK: $SDK_PATH"
          echo "Java SDK: $JAVA_PATH"
          test -d "$SDK_PATH"
          test -x "$JAVA_PATH/bin/java"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK_PATH"
          export/android/java_sdk_path = "$JAVA_PATH"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "Installed Android SDK components:"
          ls -la "$SDK_PATH"
          find "$SDK_PATH" -maxdepth 3 -type d \( -name "platform-tools" -o -name "build-tools" -o -name "platforms" \) -print
          cat "$HOME/.config/godot/editor_settings-4.tres"
      - name: Re-scan project with Android SDK configured
        run: |
          godot --headless --editor --path godot --quit
          test -f "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}/platforms/android-34/android.jar"
          test -x "${JAVA_HOME}/bin/java"
      - name: Verify default Android export templates
        run: |
          ls -lh "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk"
          test -f "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}/platforms/android-34/android.jar"
      - name: Export Android APK
        run: |
          mkdir -p godot/build
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          godot --headless --verbose --editor --path godot --quit
          godot --headless --verbose --path godot --export-debug "Android" "$GITHUB_WORKSPACE/godot/build/OLD-RACING-3D.apk"
          test -s godot/build/OLD-RACING-3D.apk
      - name: Sign and verify APK for Android installation
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          APKSIGNER="$SDK_PATH/build-tools/34.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out godot/build/OLD-RACING-3D-signed.apk godot/build/OLD-RACING-3D.apk
          "$APKSIGNER" verify --verbose godot/build/OLD-RACING-3D-signed.apk
          mv godot/build/OLD-RACING-3D-signed.apk godot/build/OLD-RACING-3D.apk
      - name: Upload 3D APK
        uses: actions/upload-artifact@v4
        with:
          name: old-racing-3d-android-apk
          path: godot/build/OLD-RACING-3D.apk
          if-no-files-found: error
