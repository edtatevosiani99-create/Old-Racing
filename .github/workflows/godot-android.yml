name: Godot Android 3D APK

on:
  push:
    branches: [main, master]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Validate Godot project and import resources
        run: godot --headless --editor --path godot --quit
      - name: Export Android APK
        run: |
          mkdir -p godot/build
          godot --headless --path godot --export-debug "Android" godot/build/OLD-RACING-3D.apk
      - name: Upload 3D APK
        uses: actions/upload-artifact@v4
        with:
          name: old-racing-3d-android-apk
          path: godot/build/OLD-RACING-3D.apk
          if-no-files-found: error
